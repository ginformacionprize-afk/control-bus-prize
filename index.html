<style>
:root{
  --bg:#E9EFEE; --surface:#FFFFFF; --ink:#13262A; --muted:#5A6E70; --line:#CCD8D6;
  --brand:#0F5257; --brand-ink:#FFFFFF; --ok:#17784A; --ok-bg:#E3F3EA; --bad:#BE3227; --bad-bg:#FBE7E4; --warn:#9A5F0C; --warn-bg:#FBF0DC;
  --field:#F4F7F6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1A1C; --surface:#152629; --ink:#E4EEEC; --muted:#93A8A6; --line:#2A4044;
    --brand:#2C8C8F; --brand-ink:#FFFFFF; --ok:#43C281; --ok-bg:#163A29; --bad:#F07463; --bad-bg:#45201B; --warn:#E5AC4F; --warn-bg:#3E2E12; --field:#1C3135;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1A1C; --surface:#152629; --ink:#E4EEEC; --muted:#93A8A6; --line:#2A4044;
  --brand:#2C8C8F; --brand-ink:#FFFFFF; --ok:#43C281; --ok-bg:#163A29; --bad:#F07463; --bad-bg:#45201B; --warn:#E5AC4F; --warn-bg:#3E2E12; --field:#1C3135;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:460px;margin:0 auto;padding:20px 18px 40px}

.login{min-height:100%;display:flex;flex-direction:column;justify-content:center}
.brandmark{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.brandmark .sq{width:46px;height:46px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:var(--brand-ink)}
.brandmark h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:30px;line-height:1;margin:0}
.brandmark p{margin:2px 0 0;color:var(--muted);font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
.f{margin-bottom:16px}
input[type=text],input[type=password],input[type=tel],input[type=date],select{
  width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--field);outline:none;text-transform:uppercase}
input[type=password]{text-transform:none}
input:focus,select:focus{border-color:var(--brand)}
input:disabled,select:disabled{opacity:.75}
.role{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:10px;background:var(--field);border:1.5px dashed var(--line);min-height:48px}
.role span{color:var(--muted);font-size:14px}
.role strong{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:20px;letter-spacing:.3px;color:var(--brand);text-align:right}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:0;border-radius:10px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:focus-visible,.tile:focus-visible,.link:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.err{color:var(--bad);font-weight:600;font-size:14px;margin:-4px 0 14px}
.err:empty{display:none}
.foot{margin-top:18px;text-align:center;font-size:14px;color:var(--muted)}
.link{background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;text-decoration:underline;padding:4px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink)}
body.app::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.top .in{max-width:460px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:10px}
.top .who{flex:1;min-width:0}
.top .who b{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;line-height:1.1}
.top .who small{display:block;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{background:rgba(255,255,255,.14);border:0;color:inherit;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
.top .sync{position:relative;display:flex;align-items:center;gap:6px}
.top .sync.spin svg{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#E8A33A;color:#13262A;font-size:12px;font-weight:800;display:grid;place-items:center}
.badge.zero{background:#43C281}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;max-width:min(420px,calc(100% - 32px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}

.tiles{display:grid;gap:12px;margin-top:8px}
.tile{display:flex;align-items:center;gap:16px;text-align:left;width:100%;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer}
.tile .ic{width:54px;height:54px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.tile .ic.alt{background:var(--field);color:var(--brand);border:1.5px solid var(--line)}
.tile b{display:block;font-size:18px}
.tile small{color:var(--muted)}
h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:28px;margin:6px 0 14px;line-height:1.1}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dnirow{display:flex;gap:8px}
.dnirow input{flex:1;min-width:0}
.dnirow .btn{width:auto;padding:0 18px}
.dni{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:28px!important;letter-spacing:3px;text-align:center}
.scanbtns{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
#reader{border-radius:12px;overflow:hidden;margin-top:12px;background:#000}

/* Resultado: debajo del DNI, compacto */
.result{display:flex;gap:12px;margin-top:14px;padding:14px;border-radius:12px;border:1.5px solid;border-left-width:6px}
.result.ok{background:var(--ok-bg);border-color:var(--ok)}
.result.bad{background:var(--bad-bg);border-color:var(--bad)}
.result.warn{background:var(--warn-bg);border-color:var(--warn)}
.result .ri{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.result.ok .ri{background:var(--ok)} .result.bad .ri{background:var(--bad)} .result.warn .ri{background:var(--warn)}
.result .rt{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:22px;line-height:1.1;margin:2px 0 4px}
.result.ok .rt{color:var(--ok)} .result.bad .rt{color:var(--bad)} .result.warn .rt{color:var(--warn)}
.result .rn{font-weight:700;margin:0}
.result .rd{font-size:14px;color:var(--muted);margin:0 0 6px}
.result .rx{font-size:14px;margin:0}
.result .rx b{font-weight:700}
.result ul{margin:4px 0 0;padding-left:18px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.result{animation:in .2s ease-out}@keyframes in{from{opacity:0;transform:translateY(-4px)}}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:28px;line-height:1}
.stat small{color:var(--muted);font-size:12px}
.stat.free b{color:var(--ok)} .stat.full b{color:var(--bad)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--field)}
.seg button{border:0;background:transparent;padding:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.seg button:focus-visible{outline:3px solid var(--warn);outline-offset:-3px}
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,20,22,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--surface);border-radius:14px;padding:20px;max-width:380px;width:100%;border:1px solid var(--line)}
.modal .mt{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:24px;margin:0 0 6px}
.modal p{margin:0 0 6px}
.modal .seats{font-size:14px;color:var(--muted);margin-bottom:16px}
.modal .prog{font-size:14px;background:var(--bad-bg);border-left:4px solid var(--bad);border-radius:6px;padding:8px 10px;margin:8px 0 10px}
.modal .seats.full{color:var(--bad);font-weight:600}
.modal .row2 .btn.no{background:var(--bad)}
.log li .st{font-size:12px;font-weight:700;white-space:nowrap}
.log{margin-top:22px}
.log h3{font-size:15px;margin:0 0 8px;color:var(--muted);font-weight:600}
.log ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.log li{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.log li:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.log li .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log li time{color:var(--muted)}
.empty{padding:14px;color:var(--muted);font-size:14px}
</style>
</head>
<body>

<section id="vLogin" class="login wrap">
  <div class="brandmark">
    <div class="sq" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 18v3M16 18v3"/><circle cx="8" cy="14.5" r=".6" fill="currentColor"/><circle cx="16" cy="14.5" r=".6" fill="currentColor"/></svg>
    </div>
    <div><h1>Control Bus Prize</h1></div>
  </div>
  <form class="panel" id="fLogin" autocomplete="off" novalidate>
    <div class="f"><label for="iUser">Placa</label><input type="text" id="iUser" autocapitalize="characters" placeholder="ABC-123" required></div>
    <div class="f"><label for="iPass">Contraseña</label><input type="password" id="iPass" required></div>
    <div class="f"><label>Rol</label><div class="role" aria-live="polite"><span id="roleHint">Se completa al escribir la placa</span><strong id="roleVal"></strong></div></div>

  </div>
</section>

<header class="top hidden" id="topbar"><div class="in">
  <div class="who"><b id="tPlaca"></b><small id="tCond"></small></div>
  <button type="button" id="bSync" class="sync" aria-label="Sincronizar registros" title="Sincronizar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></svg>
    <span class="badge zero" id="syncBadge">0</span>
  </button>
  <button type="button" id="bBack" class="hidden">Inicio</button>
  <button type="button" id="bOut">Salir</button>
</div></header>

<section id="vHome" class="wrap hidden">
  <h2>Menú</h2>
  <div class="tiles">
    <button class="tile" type="button" id="tValid">
      <span class="ic" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2.2"/><path d="M5.8 16c.5-1.5 1.7-2.3 3.2-2.3s2.7.8 3.2 2.3M14.5 10h4M14.5 13.5h3"/></svg></span>
      <span><b>Validación de pasajeros</b><small>DNI, QR o código de barras</small></span>
    </button>
  </div>
</section>

<section id="vValid" class="wrap hidden">
  <h2>Validación de pasajeros</h2>
  <div class="row2 f" id="adminBox">
    <div><label for="sPlaca">Placa</label><select id="sPlaca"></select></div>
    <div><label for="iFecha">Fecha</label><input type="date" id="iFecha"></div>

  <div class="stats" aria-live="polite">
    <div class="stat"><b id="kCap">0</b><small>Capacidad</small></div>
    <div class="stat"><b id="kProg">0</b><small>Programados</small></div>

      <span id="bCamTxt">Escanear QR / barras</span></button>

  <button class="btn ghost" type="button" id="bManif" style="margin-top:18px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>

<div id="ask" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="askT">

    <p class="prog" id="askProg"></p>
    <p class="seats" id="askSeats"></p>
    <div class="row2">
      <button class="btn no" type="button" id="askNo">No</button>

    </div>
  </div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<div id="updBar" class="toast hidden" role="status" style="bottom:calc(70px + env(safe-area-inset-bottom,0px))">Actualizando la app a la última versión…</div>

<script>
// ---------- utilidades ----------
const $ = id => document.getElementById(id);
const U = v => String(v ?? "").trim().toUpperCase();
const norm = s => U(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Z0-9]/g,"");
const padDni = v => { const d = String(v ?? "").replace(/\D/g,""); return d ? d.padStart(8,"0") : ""; };
const pad2 = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const hoyISO = () => iso(new Date());
const addDays = (s,n) => { const d = new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return iso(d); };
const fmt = s => s ? s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4) : "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hhmm = s => { const m = String(s).match(/(\d{1,2})[:.h](\d{2})/); return m ? (+m[1])*60 + (+m[2]) : null; };

// ---------- datos (solo los que llegan de OneDrive) ----------
const KEY = "pv_datos_v5";
const vacio = () => ({sync:"", maestra:[], capacidades:[], asignaciones:[]});
let DATA = vacio(), USER = null, scanner = null, scanning = false;
function load(){
  try{
    localStorage.removeItem("pv_datos_v4"); // datos de prueba / Excel manual de versiones anteriores
    const s = localStorage.getItem(KEY); if(s){ const d = JSON.parse(s); if(d && d.maestra && d.asignaciones && d.capacidades) DATA = d; }
  }catch(e){}
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DATA)); }catch(e){} }
function showSrc(){
  const d = DATA.sync ? new Date(DATA.sync) : null;
  $("srcInfo").textContent = d && !isNaN(d) ? "Última sincronización con OneDrive: " + fmt(iso(d)) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()) : "";
}

// ---------- servidor ----------
const API = "/api";
const canApi = () => location.protocol === "https:" && window.top === window.self;
const apiOn = () => { try{ return canApi() && localStorage.getItem("pv_api_on") === "1"; }catch(e){ return false; } };
let SESSION = null;
try{ SESSION = JSON.parse(localStorage.getItem("pv_sesion") || "null"); }catch(e){ SESSION = null; }
async function api(path, opt){
  opt = opt || {};
  const headers = Object.assign({}, opt.headers || {});
  if(SESSION && SESSION.token) headers.Authorization = "Bearer " + SESSION.token;
  if(opt.body) headers["Content-Type"] = "application/json";
  const r = await fetch(API + path, Object.assign({}, opt, {headers, cache:"no-store"}));
  let data = null; try{ data = await r.json(); }catch(e){}
  return {status:r.status, ok:r.ok, data};
}
async function sha(t){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join("");
}
function offUser(placa){ try{ return JSON.parse(localStorage.getItem("pv_off_" + placa) || "null"); }catch(e){ return null; } }

// ---------- login por placa ----------
const vigente = (r, f) => (!r.INICIO || r.INICIO <= f) && (!r.FIN || r.FIN >= f);
function showRol(rol){ $("roleVal").textContent = rol || ""; $("roleHint").textContent = rol ? "Rol asignado" : "Se completa al escribir la placa"; }
let rolT = null;
$("iUser").addEventListener("input", () => {
  const placa = U($("iUser").value);
  if(apiOn()){
    clearTimeout(rolT);
    rolT = setTimeout(async () => {
      try{ const r = await api("/login?placa=" + encodeURIComponent(placa)); if(U($("iUser").value) === placa) showRol(r.ok && r.data ? r.data.rol : ""); }
      catch(e){ const off = offUser(placa); showRol(off ? off.user.ROL : ""); }
    }, 350);
    return;
  }
  const rows = DATA.maestra.filter(x => x.PLACA === placa);
  const r = rows.find(x => vigente(x, hoyISO())) || rows[0];
  showRol(r ? r.ROL : "");
});
$("fLogin").addEventListener("submit", async e => {
  e.preventDefault(); $("loginErr").textContent = "";
  const placa = U($("iUser").value), pass = $("iPass").value.trim();
  if(!placa || !pass){ $("loginErr").textContent = "Escribe la placa y la contraseña."; return; }

  // 1) Con servidor (OneDrive): valida en línea
  if(canApi()){
    let r = null;
    try{ r = await api("/login", {method:"POST", body:JSON.stringify({placa, clave:pass})}); }catch(err){ r = null; }
    if(r && r.status !== 404 && r.data){
      try{ localStorage.setItem("pv_api_on","1"); }catch(e){}
      if(!r.ok){ $("loginErr").textContent = r.data.error || "No se pudo ingresar."; return; }
      SESSION = {token:r.data.token}; try{ localStorage.setItem("pv_sesion", JSON.stringify(SESSION)); }catch(e){}
      try{ localStorage.setItem("pv_off_" + placa, JSON.stringify({h: await sha(placa + "|" + pass), user:r.data.user, dia:hoyISO()})); }catch(e){}
      await loadApiData(true);
      return entrar(r.data.user);
    }
    // 2) Sin señal: usa el último ingreso correcto en este celular
    if(apiOn()){
      const off = offUser(placa);
      if(off && off.dia === hoyISO() && off.h === await sha(placa + "|" + pass)){ toast("Sin señal: ingresaste con tu último acceso. Se sincroniza al volver la señal."); return entrar(off.user); }
      $("loginErr").textContent = r ? "No se pudo conectar con el servidor. Intenta de nuevo." : "Sin señal. Ingresa una vez con internet para poder usar la app sin señal hoy.";
      return;
    }
  }

  // 3) Sin servidor: solo con datos ya sincronizados en este equipo
  const rows = DATA.maestra.filter(x => x.PLACA === placa && x.CLAVE === pass);
  if(!rows.length){ $("loginErr").textContent = "Placa o contraseña incorrectas."; return; }
  const r = rows.find(x => vigente(x, hoyISO()));
  if(!r){ $("loginErr").textContent = "La placa " + placa + " no tiene conductor asignado para hoy (" + fmt(hoyISO()) + "). Revisa las fechas en USUARIOS."; return; }
  entrar(r);
});

// ---------- registros (embarques) ----------
const RKEY = "pv_registros_v4";
let REG = [];
const newId = (dni, f, placa, tipo) => dni + "-" + f.replace(/-/g,"") + "-" + placa + "-" + tipo.charAt(0) + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
function loadReg(){ try{ REG = JSON.parse(localStorage.getItem(RKEY) || "[]"); }catch(e){ REG = []; } REG.forEach(r => { if(!r.ID) r.ID = newId(r.DNI, r.FECHA, r.PLACA, r.TIPO); }); }
function saveReg(){ try{ localStorage.setItem(RKEY, JSON.stringify(REG)); }catch(e){} }
const ST = { OK:"PROGRAMADO - SUBIÓ", EXTRA:"NO PROGRAMADO - SUBIÓ", INTENTO:"NO PROGRAMADO - INTENTÓ SUBIR" };
const subio = r => r.ESTADO === ST.OK || r.ESTADO === ST.EXTRA;
function addReg(dni, nombre, estado, prog, metodo){
  const now = new Date();
  prog = prog || {};
  // Si ya tenía un "intentó subir" en esta placa, fecha y tipo, se reemplaza por la nueva decisión
  { const {f, placa, tipo} = ctx();
    const prev = r => r.DNI === dni && r.FECHA === f && r.PLACA === placa && r.TIPO === tipo && r.ESTADO === ST.INTENTO;
    var reemplaza = REG.filter(prev).flatMap(r => r.SINC ? [r.ID] : (r.REEMPLAZA || []));
    REG = REG.filter(r => !prev(r)); }
  REG.push({FECHA:ctx().f, HORA:pad2(now.getHours())+":"+pad2(now.getMinutes()), PLACA:ctx().placa, CONDUCTOR:USER.CONDUCTOR, TIPO:ctx().tipo, DNI:dni, APELLIDOS:nombre, ESTADO:estado,
    P_PLACA: prog.PLACA || "SIN PROGRAMACIÓN", P_TIPO: prog.TIPO || "", P_HORARIO: prog.HORARIO || "", P_RUTA: prog.RUTA || "",
    ID: newId(dni, ctx().f, ctx().placa, ctx().tipo), REEMPLAZA: reemplaza, LECTURA: metodo || "DIGITADO"});
  REG[REG.length - 1].SINC = false;
  saveReg(); renderLog(); renderStats(); updateSync(); syncNow(true);
}

const ctx = () => ({ f: $("iFecha").value || hoyISO(), placa: $("sPlaca").value, tipo: TIPO });
function setTipo(t){ TIPO = t; document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.tipo === t)); $("result").innerHTML = ""; renderStats(); renderLog(); }

function capacidad(placa, f){
  const r = (DATA.capacidades || []).find(x => x.PLACA === placa && vigente(x, f));
  return r ? (parseInt(r.CAPACIDAD,10) || 0) : 0;
}
function seats(){
  const {f, placa, tipo} = ctx();
  const cap = capacidad(placa, f);
  // Cuenta personas distintas (si el Excel repite una fila, no se cuenta dos veces)
  const prog = new Set(DATA.asignaciones.filter(a => a.FECHA === f && a.PLACA === placa && a.TIPO === tipo).map(a => a.DNI)).size;
  const regs = REG.filter(r => r.FECHA === f && r.PLACA === placa && r.TIPO === tipo);
  const sub = regs.filter(subio).length;

}

$("iDni").addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g,"").slice(0,8); });
$("fDni").addEventListener("submit", e => { e.preventDefault(); validate($("iDni").value, "DIGITADO"); });
let pending = null;

function validate(raw, metodo){
  metodo = metodo || "DIGITADO";
  if(pending) return;
  const dni = String(raw).replace(/\D/g,"");
  if(dni.length !== 8){ showResult("warn","DNI incompleto","","","El DNI debe tener 8 dígitos."); $("iDni").focus(); return; }
  const {f, placa, tipo} = ctx();
  $("iDni").value = "";
  const delDia = DATA.asignaciones.filter(a => a.DNI === dni && a.FECHA === f);
  const nombre = (delDia[0] || DATA.asignaciones.find(a => a.DNI === dni) || {}).APELLIDOS || "";

  // Ya subió en esta fecha y tipo: no se registra de nuevo
  // Solo cuenta como duplicado si YA SUBIÓ en esta misma placa, fecha y tipo de viaje.
  // Los "intentó subir" no bloquean: se vuelve a preguntar si sube o no.
  const ya = REG.find(r => r.DNI === dni && r.FECHA === f && r.PLACA === placa && r.TIPO === tipo && subio(r));
  if(ya){
    showResult("warn","Ya registrado", nombre || ya.APELLIDOS, "DNI " + dni,
      `<p class="rx">Ya subió a las <b>${esc(ya.HORA)}</b> en la placa <b>${esc(ya.PLACA)}</b> (${esc(ya.TIPO)}). No se vuelve a registrar.</p>`, true);
    buzz(false); $("iDni").focus(); return;
  }

  const ok = delDia.find(a => a.PLACA === placa && a.TIPO === tipo);
  if(ok){
    addReg(dni, nombre, ST.OK, ok, metodo);
    showResult("ok","Trabajador programado", nombre, "DNI " + dni,
      `<p class="rx"><b>${esc(ok.PLACA)}</b> · ${esc(ok.TIPO)} · ${esc(ok.HORARIO)}</p>${ok.RUTA ? `<p class="rx">${esc(ok.RUTA)}</p>` : ""}`, true);
    buzz(true); $("iDni").focus(); return;
  }

  // No programado: mostrar dónde sí va y preguntar
  const donde = delDia.length
    ? `<p class="rx">Su programación del ${fmt(f)}:</p><ul>` + delDia.map(a => `<li><b>${esc(a.PLACA)}</b> · ${esc(a.TIPO)} · ${esc(a.HORARIO)}${a.RUTA ? " · " + esc(a.RUTA) : ""}</li>`).join("") + `</ul>`
    : `<p class="rx">No tiene ninguna programación para el ${fmt(f)}.</p>`;
  const nm = nombre || "Sin registro en asignaciones";
  showResult("bad","Trabajador no programado", nm, "DNI " + dni, donde, true);
  buzz(false);
  const prog = delDia.find(a => a.TIPO === tipo) || delDia[0] || null;
  pending = {dni, nombre: nombre || "SIN REGISTRO", nm, donde, prog, metodo};
  const s = seats();
  $("askName").textContent = nm + " · DNI " + dni;
  $("askProg").innerHTML = delDia.length
    ? "Programado en: " + delDia.map(a => `<b>${esc(a.PLACA)}</b> · ${esc(a.TIPO)} · ${esc(a.HORARIO)}`).join("<br>")
    : "Sin programación para el " + fmt(f) + ".";
  $("askSeats").textContent = s.cap ? (s.free > 0 ? `Quedan ${s.free} asientos libres de ${s.cap}.` : `Unidad llena: no quedan asientos libres (capacidad ${s.cap}).`) : "Capacidad de la unidad no registrada en CAPACIDADES para esta fecha.";
  $("askSeats").className = "seats" + (s.cap && s.free <= 0 ? " full" : "");
  $("ask").classList.remove("hidden"); $("askYes").focus();
}
function closeAsk(permit){
  const p = pending; if(!p) return; pending = null; $("ask").classList.add("hidden");
  if(permit){
    addReg(p.dni, p.nombre, ST.EXTRA, p.prog, p.metodo);
    showResult("warn","Subió sin programación", p.nm, "DNI " + p.dni, `<p class="rx">Registrado como no programado que sí subió.</p>` + p.donde, true);
  } else {
    addReg(p.dni, p.nombre, ST.INTENTO, p.prog, p.metodo);

}

// La librería de Excel (~300 KB) se pide solo cuando hace falta; se precarga después del inicio para tenerla sin señal.
const XLSX_URL = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
let xlsxP = null;
function loadXlsx(){
  if(window.XLSX) return Promise.resolve();
  return xlsxP ??= new Promise((ok, ko) => {
    const s = document.createElement("script"); s.src = XLSX_URL; s.async = true;
    s.onload = ok; s.onerror = () => { xlsxP = null; s.remove(); ko(new Error("sin conexión")); };
    document.head.appendChild(s);
  });
}
const XHDR = ["FECHA","DNI","APELLIDOS","PLACA EJECUTADA","TURNO EJECUTADO","HORA EJECUTADA","CONDUCTOR","ESTADO"];
async function getDownloads(){
  try{ if(window.claude && typeof window.claude.use === "function") return await window.claude.use("downloads"); }catch(e){}
  return null;
}
// Manifiesto: solo los que SUBIERON, de la placa, fecha y tipo de viaje seleccionados
$("bManif").onclick = async () => {
  const {f, placa, tipo} = ctx();
  const list = REG.filter(r => r.FECHA === f && r.PLACA === placa && r.TIPO === tipo && subio(r));
  if(!list.length){ toast("No hay pasajeros que hayan subido en " + placa + " · " + tipo + " · " + fmt(f) + "."); return; }
  try{ await loadXlsx(); }catch(e){ toast("No se pudo preparar el manifiesto (sin conexión). Intenta de nuevo con señal."); return; }
  const rows = list.map(r => {
    const [y,m,d] = r.FECHA.split("-").map(Number);
    return [(Date.UTC(y, m-1, d) - Date.UTC(1899, 11, 30)) / 86400000, r.DNI, r.APELLIDOS, r.PLACA, r.TIPO, r.HORA, r.CONDUCTOR, r.ESTADO];
  });
  const ws = XLSX.utils.aoa_to_sheet([XHDR, ...rows]);
  for(let i = 2; i <= rows.length + 1; i++){ const c = ws["A"+i]; if(c){ c.t = "n"; c.z = "dd/mm/yyyy"; } }
  ws["!cols"] = [12,11,38,15,15,14,32,30].map(w => ({wch:w}));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "MANIFIESTO");
  const name = "MANIFIESTO_" + placa + "_" + tipo + "_" + f + ".xlsx";
  const buf = XLSX.write(wb, {type:"array", bookType:"xlsx"});
  const dl = await getDownloads();
  if(dl){
    try{ await dl.save({filename:name, data:new Blob([buf])}); }
    catch(err){ if(err && err.code !== "declined") toast("No se pudo descargar el manifiesto en esta vista."); }
  } else {
    XLSX.writeFile(wb, name);
  }
};

// ---------- sincronización con OneDrive ----------
// Los registros se envían al servidor (/api/registros), que los escribe en REGISTROS_EMBARQUE.xlsx de OneDrive.
// Si no hay servidor o señal, quedan guardados en el equipo como PENDIENTES.
let syncing = false;
const pendientes = () => REG.filter(r => !r.SINC && (isAdmin() || !USER || r.PLACA === USER.PLACA));
function updateSync(){
  const n = pendientes().length, b = $("syncBadge");
  b.textContent = n; b.className = "badge" + (n ? "" : " zero");
  $("bSync").title = n ? n + " registros por sincronizar" : "Todo sincronizado";
}
let toastT = null;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.remove("hidden"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add("hidden"), 3500); }
function toRow(r){
  return {ID:r.ID, REEMPLAZA:r.REEMPLAZA || [], LECTURA:r.LECTURA || "DIGITADO", FECHA:r.FECHA, DNI:r.DNI, APELLIDOS:r.APELLIDOS, PLACA_PROGRAMADA:r.P_PLACA || "", TURNO_PROGRAMADO:r.P_TIPO || "", HORARIO_PROGRAMADO:r.P_HORARIO || "", RUTA_PROGRAMADA:r.P_RUTA || "",
    PLACA_EJECUTADA:r.PLACA, TURNO_EJECUTADO:r.TIPO, HORA_EJECUTADA:r.HORA, CONDUCTOR:r.CONDUCTOR, ESTADO:r.ESTADO, COINCIDE_PLACA:(r.P_PLACA && r.P_PLACA === r.PLACA) ? "SI" : "NO"};
}
async function syncNow(silent){
  if(syncing || !USER) return;
  const list = pendientes();
  if(!list.length){ if(!silent) toast("Todo sincronizado. No hay registros pendientes."); return; }
  if(!apiOn() || !SESSION){ if(!silent) toast(list.length + " registros guardados en este equipo. Falta conectar OneDrive para enviarlos; mientras tanto descarga el manifiesto."); return; }
  if(!navigator.onLine){ if(!silent) toast("Sin internet. " + list.length + " registros quedan pendientes y se enviarán al volver la señal."); return; }
  syncing = true; $("bSync").classList.add("spin");
  try{
    const res = await api("/registros", {method:"POST", body:JSON.stringify({registros:list.map(toRow)})});
    if(res.status === 401){ sesionVencida(); throw new Error("sesión vencida"); }
    if(!res.ok) throw new Error((res.data && res.data.error) || ("HTTP " + res.status));
    list.forEach(r => { r.SINC = true; r.REEMPLAZA = []; }); saveReg();
    if(!silent) toast(list.length + " registros sincronizados con OneDrive.");
  }catch(err){
    if(!silent) toast("No se pudo sincronizar (" + err.message + "). Los registros siguen guardados; intenta de nuevo.");
  }finally{
    syncing = false; $("bSync").classList.remove("spin"); updateSync();
  }
}

function dniFromCode(text){ const t = String(text||""); const m = t.match(/(?<!\d)\d{8}(?!\d)/) || t.match(/\d{8}/); return m ? m[0] : ""; }
// El lector se carga con "defer": si se pide la cámara antes de que termine, se espera hasta 10 s
function waitQr(){
  return new Promise(ok => { const t0 = Date.now(); (function w(){ if(typeof Html5Qrcode !== "undefined" || Date.now() - t0 > 10000) ok(); else setTimeout(w, 100); })(); });
}
function makeScanner(){
  if(typeof Html5Qrcode === "undefined") throw new Error("El lector no cargó.");
  const F = Html5QrcodeSupportedFormats;
  return new Html5Qrcode("reader", {verbose:false, formatsToSupport:[F.QR_CODE,F.PDF_417,F.CODE_128,F.CODE_39,F.EAN_13]});
}
function onCode(text, result){
  const formato = (result && result.result && result.result.format && result.result.format.formatName) || "";
  const metodo = /QR/i.test(formato) ? "QR" : "CÓDIGO DE BARRAS";
  const dni = dniFromCode(text); stopCam();
  if(!dni){ showResult("warn","Código sin DNI","","","Se leyó el código, pero no tiene un DNI de 8 dígitos. Escríbelo a mano."); resumeCam(); return; }
  validate(dni, metodo);
  $("iDni").blur();
  resumeCam();
}
async function startCam(){
  try{
    $("reader").classList.remove("hidden"); await waitQr(); scanner = scanner || makeScanner();
    await scanner.start({facingMode:"environment"}, {fps:10, qrbox:(w,h)=>({width:Math.min(300,w*0.85), height:Math.min(180,h*0.6)})}, onCode, ()=>{});
    scanning = true; autoCam = true; $("bCamTxt").textContent = "Detener cámara";
    try{ localStorage.setItem("pv_cam_ok", "1"); }catch(e){}
    $("iDni").blur();
  }catch(err){
    $("reader").classList.add("hidden");
    showResult("warn","Cámara no disponible","","", (!window.isSecureContext || !navigator.mediaDevices)
      ? "La app está abierta como archivo. La cámara solo funciona abriendo la app desde su link https. Mientras tanto, escribe el número."
      : "No se pudo abrir la cámara. Revisa el permiso de cámara o escribe el número.");
  }
}
function stopCam(){ if(scanner && scanning){ scanner.stop().catch(()=>{}); } scanning = false; $("bCamTxt").textContent = "Escanear QR / barras"; $("reader").classList.add("hidden"); }
$("bCam").onclick = () => { if(scanning){ autoCam = false; stopCam(); } else { startCam(); } };

// Cámara directa: si ya se dio permiso antes, se abre sola al entrar y se reabre después de cada validación

  try{ return localStorage.getItem("pv_cam_ok") === "1"; }catch(e){ return false; }
}
function enValidacion(){ return !$("vValid").classList.contains("hidden"); }
function resumeCam(){

  setTimeout(() => { if(autoCam && !pending && !scanning && enValidacion()) startCam(); }, 1500);
}

// ---------- PWA: instalación y actualización automática ----------
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("bInstall").hidden = false; });
$("bInstall").onclick = async () => { if(!installEvt) return; installEvt.prompt(); try{ await installEvt.userChoice; }catch(e){} installEvt = null; $("bInstall").hidden = true; };
window.addEventListener("appinstalled", () => { $("bInstall").hidden = true; toast("App instalada. Ábrela desde el ícono Control Bus."); });

if("serviceWorker" in navigator && window.top === window.self && location.protocol === "https:"){
  navigator.serviceWorker.register("sw.js").then(reg => {
    const check = () => reg.update().catch(()=>{});
    setInterval(check, 15 * 60 * 1000);
    document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") check(); });
  }).catch(()=>{});
  // Cuando se publica una versión nueva, la app se recarga sola (sin perder registros: están guardados en el equipo)
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if(reloading) return; reloading = true;
    if(pending) return; // no recargar en medio de una decisión
    $("updBar").classList.remove("hidden");
    setTimeout(() => location.reload(), 800);
  });
}

// ---------- Conexión con OneDrive (servidor /api en Vercel) ----------
// Los datos (USUARIOS, CAPACIDADES, ASIGNACIONES) se leen del Excel de OneDrive a través del servidor.
// Se refrescan solos cada minuto, al volver a la app y al tocar Sincronizar.
async function loadApiData(silent){
  if(!apiOn() || !SESSION) return false;
  try{
    const r = await api("/datos");
    if(r.status === 401){ sesionVencida(); return false; }
    if(!r.ok || !r.data) return false;
    DATA = {sync:r.data.actualizado || new Date().toISOString(),
            maestra:r.data.maestra || [], capacidades:r.data.capacidades || [], asignaciones:r.data.asignaciones || []};
    save(); showSrc();
    if(USER && !$("vValid").classList.contains("hidden")){ renderStats(); }
    if(!silent) toast("Datos actualizados desde OneDrive.");
    return true;
  }catch(e){ return false; }
}
const loadRemote = loadApiData;
function sesionVencida(){
  SESSION = null; try{ localStorage.removeItem("pv_sesion"); }catch(e){}
  toast("Tu sesión venció. Sal y vuelve a ingresar con tu placa y contraseña.");
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && USER){ loadApiData(true); syncNow(true); } });
setInterval(() => { if(USER && document.visibilityState === "visible") loadApiData(true); }, 60 * 1000);
</script>
